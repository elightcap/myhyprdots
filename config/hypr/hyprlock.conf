# Catppuccin Mocha lock screen over a blurred copy of the desktop.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = CaskaydiaMono Nerd Font
    color = rgb(cdd6f4)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 22
    font_family = CaskaydiaMono Nerd Font
    color = rgb(bac2de)
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 440, 64
    position = 0, -60
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb(89b4fa) rgb(cba6f7) 45deg
    inner_color = rgba(1e1e2ecc)
    font_color = rgb(cdd6f4)
    font_family = CaskaydiaMono Nerd Font
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    placeholder_text = <span foreground="##7f849c">Password</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 14
    dots_center = true
    fade_on_empty = false
    shadow_passes = 2
}

auth {
    fingerprint:enabled = false
}
