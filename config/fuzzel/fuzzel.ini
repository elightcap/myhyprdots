# Catppuccin Mocha launcher. SUPER + SPACE.
[main]
font=CaskaydiaMono Nerd Font Propo:size=13
prompt="❯ "
icon-theme=Papirus-Dark
terminal=kitty -e
layer=overlay
width=42
lines=12
horizontal-pad=22
vertical-pad=16
inner-pad=10
line-height=26
letter-spacing=0.2
match-counter=yes

[colors]
background=1e1e2eeb
text=cdd6f4ff
prompt=cba6f7ff
placeholder=7f849cff
input=cdd6f4ff
match=89b4faff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f9e2afff
counter=6c7086ff
border=89b4faff

[border]
width=2
radius=14
