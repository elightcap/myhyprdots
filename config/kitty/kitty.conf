include themes/catppuccin-mocha.conf

# Font: the one you used under Omarchy. CTRL+SHIFT+= / - change size live.
font_family      CaskaydiaMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
disable_ligatures cursor

# Window
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.85
dynamic_background_opacity yes
enabled_layouts splits,stack
remember_window_size no
initial_window_width  120c
initial_window_height 36c

# Cursor: a short trail makes big jumps easy to follow.
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.35

# Scrollback, links and selection
scrollback_lines 20000
scrollback_pager_history_size 64
url_style curly
detect_urls yes
strip_trailing_spaces smart
mouse_hide_wait 2.0

# Bells and notifications: no beeps; a desktop notification when a command
# that ran over 15 seconds finishes while kitty is in the background.
enable_audio_bell no
window_alert_on_bell yes
notify_on_cmd_finish unfocused 15.0

# Tabs
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2
tab_title_template    "{index}: {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"

# Shell integration and remote control (local socket only)
shell_integration enabled
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# Keys. kitty_mod is CTRL+SHIFT. SUPER+C / SUPER+V also copy and paste, from Hyprland.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Shift+Enter and Alt+Shift+Enter as CSI-u, so TUIs and tmux can tell them apart.
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u
# Splits: new split in the current directory, move between and resize them.
map kitty_mod+enter launch --cwd=current --location=split
map kitty_mod+backslash launch --cwd=current --location=vsplit
map kitty_mod+minus launch --cwd=current --location=hsplit
map kitty_mod+left  neighboring_window left
map kitty_mod+right neighboring_window right
map kitty_mod+up    neighboring_window up
map kitty_mod+down  neighboring_window down
map kitty_mod+z     toggle_layout stack
map kitty_mod+r     start_resizing_window
# Tabs open in the current directory too.
map kitty_mod+t new_tab_with_cwd
