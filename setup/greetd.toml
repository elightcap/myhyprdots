# Login screen: tuigreet on tty1, starting Hyprland. Written by ~/hypr-setup/install.sh.
# Colours come from the Catppuccin console palette set on the kernel command
# line (vt.default_*): lightmagenta = mauve, lightblue = lavender, gray =
# subtext1, white = text, darkgray = surface2. The greeting carries ANSI
# colour codes (\u001b[..m): a block-letter HYPRLAND, pink→mauve→lavender→blue,
# with a crust-coloured drop shadow. Generated by make-banner.py.
# "--background night" and "--border-corner" need the patched tuigreet built
# from ~/git/tuigreet (branch night-sky) into /usr/local/bin; install.sh does
# that. The key-hint bar is hidden (TUIGREET_STATUS_POSITION) but the keys
# still work: F2 command, F3 session, F4 background, F12 power.
# Preview: ./preview-greeter.sh
[terminal]
vt = 1

[default_session]
command = "env TUIGREET_STATUS_POSITION=hidden /usr/local/bin/tuigreet --time --time-format '%A, %d %B · %H:%M' --remember --remember-session --asterisks --asterisks-char '•' --greeting '\u001b[35m██  ██ ██  ██ \u001b[95m█████  █████  \u001b[94m██      ████  \u001b[34m██  ██ █████  \u001b[39m\n\u001b[35m██\u001b[92m█ \u001b[35m██\u001b[92m█\u001b[35m██\u001b[92m█ \u001b[35m██\u001b[92m█\u001b[95m██\u001b[92m██\u001b[95m██ ██\u001b[92m██\u001b[95m██ \u001b[94m██\u001b[92m█    \u001b[94m██\u001b[92m██\u001b[94m██ \u001b[34m███ ██\u001b[92m█\u001b[34m██\u001b[92m██\u001b[34m██ \u001b[39m\n\u001b[35m██████\u001b[92m█ \u001b[35m████\u001b[92m██\u001b[95m█████\u001b[92m██\u001b[95m█████\u001b[92m██\u001b[94m██\u001b[92m█    \u001b[94m██████\u001b[92m█\u001b[34m██\u001b[92m█\u001b[34m███\u001b[92m█\u001b[34m██\u001b[92m█ \u001b[34m██\u001b[92m█\u001b[39m\n\u001b[35m██\u001b[92m██\u001b[35m██\u001b[92m█  \u001b[35m██\u001b[92m██ \u001b[95m██\u001b[92m████ \u001b[95m██\u001b[92m█\u001b[95m██\u001b[92m█ \u001b[94m██\u001b[92m█    \u001b[94m██\u001b[92m██\u001b[94m██\u001b[92m█\u001b[34m██\u001b[92m█ \u001b[34m██\u001b[92m█\u001b[34m██\u001b[92m█ \u001b[34m██\u001b[92m█\u001b[39m\n\u001b[35m██\u001b[92m█ \u001b[35m██\u001b[92m█  \u001b[35m██\u001b[92m█  \u001b[95m██\u001b[92m█    \u001b[95m██\u001b[92m█ \u001b[95m██ \u001b[94m██████ ██\u001b[92m█ \u001b[94m██\u001b[92m█\u001b[34m██\u001b[92m█ \u001b[34m██\u001b[92m█\u001b[34m█████\u001b[92m██\u001b[39m\n \u001b[92m██  ██   ██   ██     ██  ██ ██████ ██  ██ ██  ██ █████ \u001b[39m\n ' --greet-align center --width 66 --window-padding 2 --container-padding 2 --prompt-padding 1 --border-corner '◆' --theme 'container=black;border=lightmagenta;title=lightmagenta;text=gray;greet=lightblue;time=lightblue;prompt=lightmagenta;input=white;action=darkgray;button=lightmagenta' --background night --background-fps 15 --power-shutdown 'systemctl poweroff' --power-reboot 'systemctl reboot' --cmd start-hyprland"
user = "greeter"
